name: Build Open Integration Engine

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Event File
        path: ${{ github.event_path }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          java-package: 'jdk+fx'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Build, test, and generate SBOM (unsigned)
        run: ./gradlew --no-daemon build cyclonedxBom -Pcoverage=true

      - name: Prepare distribution SBOM output
        run: mkdir -p build/reports/sbom

      - name: Generate distribution SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: server/setup
          format: cyclonedx-json
          output-file: build/reports/sbom/openintegrationengine.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Scan distribution SBOM
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: build/reports/sbom/openintegrationengine.cdx.json
          output-format: json
          output-file: build/reports/sbom/grype-results.json
          severity-cutoff: high
          fail-build: false
          cache-db: true

      - name: Upload CycloneDX SBOMs and vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oie-cyclonedx-sboms
          path: |
            build/reports/cyclonedx/bom.json
            build/reports/sbom/openintegrationengine.cdx.json
            build/reports/sbom/grype-results.json
          if-no-files-found: error

      - name: Package distribution
        run: tar czf openintegrationengine-unsigned.tar.gz -C server/ setup --transform 's|^setup|openintegrationengine/|'

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oie-unsigned-build
          path: openintegrationengine-unsigned.tar.gz
          if-no-files-found: error

      - name: Stage Test Results
        if: (!cancelled())
        run: |
          mkdir -p aggregate-test-results
          # Copy the directory structures
          cp -r --parents */build/test-results aggregate-test-results/

      - name: Upload Test Results
        if: (!cancelled())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test Results
          path: |
            aggregate-test-results/**/*.xml
