name: Dependency Security

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '**/*.gradle'
      - '**/lib/**/*.jar'
      - 'gradle/libs.versions.toml'
      - 'gradle/verification-metadata.xml'
      - '.github/workflows/dependency-security.yaml'
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

jobs:
  dependency_scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          java-package: 'jdk+fx'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            notifications
            dependency-check-data

      - name: Assemble unsigned distribution
        run: ./gradlew --no-daemon build -PdisableTests=true

      - name: Prepare security report output
        run: mkdir -p build/reports/sbom

      - name: Generate distribution SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: server/setup
          format: cyclonedx-json
          output-file: build/reports/sbom/openintegrationengine.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Scan distribution dependencies
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: build/reports/sbom/openintegrationengine.cdx.json
          output-format: json
          output-file: build/reports/sbom/grype-results.json
          severity-cutoff: high
          fail-build: false
          cache-db: true

      - name: Run OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        run: ./gradlew --no-daemon dependencyCheckAggregate

      - name: Note optional NVD configuration
        if: env.NVD_API_KEY == ''
        run: echo "::notice::NVD_API_KEY is not configured; the complete Syft/Grype distribution scan ran, but the supplementary OWASP scan was skipped to avoid NVD rate-limit failures."

      - name: Upload dependency security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-reports
          path: |
            build/reports/sbom/openintegrationengine.cdx.json
            build/reports/sbom/grype-results.json
            build/reports/dependency-check-report.html
            build/reports/dependency-check-report.sarif
          if-no-files-found: error
